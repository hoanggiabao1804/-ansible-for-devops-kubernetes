appName: servicename
appImage: gcr.io/google-samples/microservices-demo/servicename
appVersion: v0.2.3
appReplicas: 1
containerPort: 8080
containerEnvVars:
- name: ENV_VAR_ONE
  value: "valueone"
- name: ENV_VAR_TWO
  value: "valuetwo"

servicePort: 8080
serviceType: ClusterIP

# Kubernetes container mappings, configured per service by the project.
# Empty mappings omit the corresponding fields from the rendered Deployment.
resources: {}
startupProbe: {}
readinessProbe: {}
livenessProbe: {}

# Optional scheduling and voluntary disruption policy.
affinity: {}
podDisruptionBudget: {}
