---
- name: Verify Kubernetes cluster and Online Boutique
  hosts: k8s_master
  become: true
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../vars/verify.yml"
    - "{{ playbook_dir }}/../vars/cluster.yml"

  vars:
    expected_nodes:
      - name: "{{ groups['k8s_master'][0] }}"
        ip: "{{ hostvars[groups['k8s_master'][0]].ansible_host }}"

      - name: "{{ groups['k8s_nodes'][0] }}"
        ip: "{{ hostvars[groups['k8s_nodes'][0]].ansible_host }}"

  tasks:

    # ================================================================
    # 1. Verify Kubernetes nodes
    # ================================================================

    - name: Read Kubernetes node Ready status and InternalIP.
      ansible.builtin.command:
        cmd: >-
          kubectl
          --kubeconfig {{ verify_kubeconfig }}
          get node {{ item.name }}
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}
          {.status.addresses[?(@.type=="InternalIP")].address}'
      loop: "{{ expected_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      register: node_status
      changed_when: false

    - name: Assert Kubernetes nodes are Ready and use private IPs.
      ansible.builtin.assert:
        that:
          - item.stdout.split() | length == 2
          - item.stdout.split()[0] == "True"
          - item.stdout.split()[1] == item.item.ip
        fail_msg: >-
          Node {{ item.item.name }} is not Ready or is not registered
          with expected private IP {{ item.item.ip }}.
        success_msg: >-
          Node {{ item.item.name }} is Ready with private IP
          {{ item.item.ip }}.
      loop: "{{ node_status.results }}"
      loop_control:
        label: "{{ item.item.name }}"


    # ================================================================
    # 2. Verify all 11 deployments exist and are available
    # ================================================================

    - name: Read Online Boutique deployment replica status.
      ansible.builtin.command:
        cmd: >-
          kubectl
          --kubeconfig {{ verify_kubeconfig }}
          -n {{ verify_namespace }}
          get deployment {{ item }}
          -o jsonpath='{.spec.replicas}
          {.status.readyReplicas}
          {.status.availableReplicas}'
      loop: "{{ verify_deployments }}"
      register: deployment_status
      changed_when: false

    - name: Assert all Online Boutique deployments are available.
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout.split() | length == 3
          - item.stdout.split()[0] == "1"
          - item.stdout.split()[1] == "1"
          - item.stdout.split()[2] == "1"
        fail_msg: >-
          Deployment {{ item.item }} is not fully available.
          Current state: {{ item.stdout }}
        success_msg: >-
          Deployment {{ item.item }} is available (1/1).
      loop: "{{ deployment_status.results }}"
      loop_control:
        label: "{{ item.item }}"


    # ================================================================
    # 3. Verify checkoutservice naming fix
    # ================================================================

    - name: Verify checkoutservice Deployment exists.
      ansible.builtin.command:
        cmd: >-
          kubectl
          --kubeconfig {{ verify_kubeconfig }}
          -n {{ verify_namespace }}
          get deployment checkoutservice
      register: checkout_deployment
      changed_when: false

    - name: Verify checkoutservice Service exists.
      ansible.builtin.command:
        cmd: >-
          kubectl
          --kubeconfig {{ verify_kubeconfig }}
          -n {{ verify_namespace }}
          get service checkoutservice
      register: checkout_service
      changed_when: false

    - name: Check that broken servicename Deployment does not exist.
      ansible.builtin.command:
        cmd: >-
          kubectl
          --kubeconfig {{ verify_kubeconfig }}
          -n {{ verify_namespace }}
          get deployment servicename --ignore-not-found -o name
      register: broken_checkout_deployment
      changed_when: false

    - name: Check that broken servicename Service does not exist.
      ansible.builtin.command:
        cmd: >-
          kubectl
          --kubeconfig {{ verify_kubeconfig }}
          -n {{ verify_namespace }}
          get service servicename --ignore-not-found -o name
      register: broken_checkout_service
      changed_when: false

    - name: Assert checkoutservice naming override works.
      ansible.builtin.assert:
        that:
          - checkout_deployment.rc == 0
          - checkout_service.rc == 0
          - broken_checkout_deployment.rc == 0
          - broken_checkout_service.rc == 0
          - broken_checkout_deployment.stdout | trim == ""
          - broken_checkout_service.stdout | trim == ""
        fail_msg: >-
          checkoutservice naming verification failed. The upstream
          'servicename' bug may still be present.
        success_msg: >-
          checkoutservice exists with the correct name and no
          'servicename' resource exists.


    # ================================================================
    # 4. Verify frontend is internal only (ClusterIP)
    # ================================================================

    - name: Read frontend Service type.
      ansible.builtin.command:
        cmd: >-
          kubectl
          --kubeconfig {{ verify_kubeconfig }}
          -n {{ verify_namespace }}
          get service frontend
          -o jsonpath='{.spec.type}'
      register: frontend_service
      changed_when: false

    - name: Assert frontend is a ClusterIP Service.
      ansible.builtin.assert:
        that:
          - frontend_service.stdout == "ClusterIP"
        fail_msg: >-
          frontend is {{ frontend_service.stdout }}, expected ClusterIP.
          All external traffic must enter through the Ingress controller.
        success_msg: >-
          frontend is ClusterIP and only reachable through the Ingress.


    # ================================================================
    # 5. Verify Ingress controller and Ingress resource
    # ================================================================

    - name: Wait for the Ingress controller rollout.
      ansible.builtin.command:
        cmd: >-
          kubectl
          --kubeconfig {{ verify_kubeconfig }}
          -n {{ ingress_namespace }}
          rollout status deployment/{{ ingress_release }}-controller
          --timeout=120s
      changed_when: false

    - name: Read Ingress controller Service type and HTTP NodePort.
      ansible.builtin.command:
        cmd: >-
          kubectl
          --kubeconfig {{ verify_kubeconfig }}
          -n {{ ingress_namespace }}
          get service {{ ingress_release }}-controller
          -o jsonpath='{.spec.type} {.spec.ports[?(@.name=="http")].nodePort}'
      register: ingress_controller_service
      changed_when: false

    - name: Assert Ingress controller is exposed on the fixed NodePort.
      ansible.builtin.assert:
        that:
          - ingress_controller_service.stdout.split() | length == 2
          - ingress_controller_service.stdout.split()[0] == "NodePort"
          - ingress_controller_service.stdout.split()[1] | int == ingress_http_nodeport | int
        fail_msg: >-
          Ingress controller Service is not NodePort {{ ingress_http_nodeport }}.
          Current state: {{ ingress_controller_service.stdout }}
        success_msg: >-
          Ingress controller is exposed on NodePort {{ ingress_http_nodeport }}.

    - name: Read frontend Ingress class, host and backend.
      ansible.builtin.command:
        cmd: >-
          kubectl
          --kubeconfig {{ verify_kubeconfig }}
          -n {{ verify_namespace }}
          get ingress frontend
          -o jsonpath='{.spec.ingressClassName}
          {.spec.rules[0].host}
          {.spec.rules[0].http.paths[0].backend.service.name}'
      register: frontend_ingress
      changed_when: false

    - name: Assert frontend Ingress routes the hostname to frontend.
      ansible.builtin.assert:
        that:
          - frontend_ingress.stdout.split() | length == 3
          - frontend_ingress.stdout.split()[0] == ingress_class_name
          - frontend_ingress.stdout.split()[1] == ingress_hostname
          - frontend_ingress.stdout.split()[2] == "frontend"
        fail_msg: >-
          Ingress frontend is misconfigured. Current state: {{ frontend_ingress.stdout }}
        success_msg: >-
          Ingress routes {{ ingress_hostname }} to Service frontend
          (class {{ ingress_class_name }}).


    # ================================================================
    # 6. Verify HTTP storefront through the Ingress hostname
    # ================================================================

    # Send the Host header explicitly so the check does not depend on
    # /etc/hosts on the control plane.
    - name: Set Ingress endpoint.
      ansible.builtin.set_fact:
        ingress_endpoint: >-
          http://{{ hostvars[groups['k8s_nodes'][0]].ansible_host }}:{{ ingress_http_nodeport }}/
        storefront_url: "http://{{ ingress_hostname }}:{{ ingress_http_nodeport }}/"

    - name: Request storefront through the Ingress hostname.
      ansible.builtin.uri:
        url: "{{ ingress_endpoint }}"
        method: GET
        headers:
          Host: "{{ ingress_hostname }}"
        return_content: true
        status_code: 200
      register: storefront_http
      changed_when: false
      failed_when: false
      retries: 12
      delay: 5
      until:
        - storefront_http.status | default(0) == 200

    - name: Assert storefront returned HTTP 200 through the Ingress.
      ansible.builtin.assert:
        that:
          - storefront_http.status == 200
        fail_msg: >-
          {{ storefront_url }} did not return HTTP 200 through the Ingress.
        success_msg: >-
          Storefront returned HTTP 200 from {{ storefront_url }}.

    - name: Assert storefront contains recognisable content.
      ansible.builtin.assert:
        that:
          - >-
            storefront_markers
            | select('in', storefront_http.content | default(''))
            | list | length > 0
        fail_msg: >-
          Storefront returned HTTP 200, but the expected Online Boutique
          content was not found.
        success_msg: >-
          Storefront response contains recognisable Online Boutique content.

    # Proves routing is by hostname, not "any request on the port".
    - name: Request the Ingress with an unknown hostname.
      ansible.builtin.uri:
        url: "{{ ingress_endpoint }}"
        method: GET
        headers:
          Host: "unknown.{{ ingress_hostname }}"
        status_code: 404
      register: unknown_host_http
      changed_when: false

    - name: Assert unknown hostname is not routed to the storefront.
      ansible.builtin.assert:
        that:
          - unknown_host_http.status == 404
        fail_msg: >-
          Unknown hostname returned {{ unknown_host_http.status }}; routing is
          not hostname-based.
        success_msg: >-
          Unknown hostname returned 404; routing is hostname-based.


    # ================================================================
    # 7. Print verification summary
    # ================================================================

    - name: Print verification summary.
      ansible.builtin.debug:
        msg:
          - "Kubernetes nodes: PASS"
          - "11 Online Boutique deployments: PASS"
          - "checkoutservice naming: PASS"
          - "frontend ClusterIP: PASS"
          - "Ingress controller and frontend Ingress: PASS"
          - "Hostname routing (200 known / 404 unknown): PASS"
          - "Storefront URL: {{ storefront_url }}"
