---
# Explicit lab experiment: checkout is temporarily unavailable, then restored.
# This playbook is intentionally separate from site.yml.
- name: Reproduce and recover the upstream checkout naming bug
  hosts: k8s_master
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../vars/microservices.yml"

  vars:
    checkout_diagnosis_root: /tmp/project01-checkout-diagnosis
    checkout_diagnosis_observation_seconds: 0
    checkout_entry: "{{ microservices | selectattr('release', 'equalto', 'checkoutservice') | first }}"
    checkout_chart: "{{ microservice_src }}/{{ checkout_entry.chart }}"
    checkout_values_file: "{{ microservice_src }}/{{ checkout_entry.values_file }}"
    checkout_kubectl:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_conf }}"
      - --namespace
      - "{{ microservice_namespace }}"
      - --request-timeout=30s

  pre_tasks:
    - name: Validate the experiment settings.
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - groups['k8s_master'] | length == 1
          - checkout_diagnosis_root.startswith('/')
          - checkout_diagnosis_observation_seconds | int >= 0
          - checkout_diagnosis_observation_seconds | int <= 300
        fail_msg: This live lab experiment needs one master, an absolute evidence path and a 0-300 second observation window; --check is unsupported.

    - name: Confirm the pinned upstream checkout.
      ansible.builtin.command:
        argv: [git, -C, "{{ microservice_src }}", rev-parse, HEAD]
      register: checkout_upstream_commit
      changed_when: false

    - name: Check that upstream tracked files are unmodified.
      ansible.builtin.command:
        argv: [git, -C, "{{ microservice_src }}", status, --porcelain, --untracked-files=no]
      register: checkout_upstream_status
      changed_when: false

    - name: Save the current checkout release values for restoration.
      ansible.builtin.command:
        argv:
          - "{{ helm_binary_path }}"
          - get
          - values
          - checkoutservice
          - --namespace
          - "{{ microservice_namespace }}"
          - --kubeconfig
          - "{{ kubernetes_admin_conf }}"
          - --output=json
      register: checkout_original_values
      changed_when: false

    - name: Check that no leftover broken resources exist.
      ansible.builtin.command:
        argv: "{{ checkout_kubectl + ['get', 'deployment,service', 'servicename', '--ignore-not-found', '-o', 'name'] }}"
      register: checkout_existing_broken
      changed_when: false

    - name: Require the fixed baseline before touching the checkout release.
      ansible.builtin.assert:
        that:
          - checkout_upstream_commit.stdout == microservice_repo_version
          - checkout_upstream_status.stdout | trim == ''
          - (checkout_original_values.stdout | from_json).appName == 'checkoutservice'
          - (checkout_original_values.stdout | from_json).appReplicas | int == 1
          - checkout_existing_broken.stdout | trim == ''
        fail_msg: Deploy the pinned baseline first; this experiment expects the existing fixed checkout release and an unmodified upstream checkout.

  tasks:
    - name: Choose one evidence directory for this run.
      ansible.builtin.set_fact:
        checkout_run_dir: "{{ checkout_diagnosis_root }}/{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
        checkout_saved_values: "{{ checkout_original_values.stdout | from_json }}"
        checkout_experiment_failed: false

    - name: Create the evidence directories outside the repository.
      ansible.builtin.file:
        path: "{{ checkout_run_dir }}/{{ item }}"
        state: directory
        mode: '0755'
      loop: [source, baseline, broken, restored]

    - name: Install the demo checkout probe for this experiment.
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/checkout-smoke.py"
        dest: "{{ checkout_run_dir }}/checkout-smoke.py"
        mode: '0755'

    - name: Preserve the original release values.
      ansible.builtin.copy:
        content: "{{ checkout_saved_values | to_nice_json }}\n"
        dest: "{{ checkout_run_dir }}/baseline/checkout-values.json"
        mode: '0644'

    - name: Save the exact upstream files used by this run.
      ansible.builtin.copy:
        src: "{{ microservice_src }}/{{ item.src }}"
        dest: "{{ checkout_run_dir }}/source/{{ item.dest }}"
        remote_src: true
        mode: '0644'
      loop:
        - {src: values/checkout-service-values.yaml, dest: checkout-service-values.yaml}
        - {src: chart/microservice/values.yaml, dest: chart-default-values.yaml}
        - {src: chart/microservice/templates/deployment.yaml, dest: deployment-template.yaml}
        - {src: chart/microservice/templates/service.yaml, dest: service-template.yaml}

    - name: Render the upstream and corrected checkout manifests without deploying.
      ansible.builtin.command:
        argv: "{{ [helm_binary_path, 'template', 'checkoutservice', checkout_chart, '-f', checkout_values_file, '--set', 'appReplicas=1'] + item.overrides }}"
      loop:
        - {name: upstream, overrides: []}
        - {name: corrected, overrides: [--set, appName=checkoutservice]}
      register: checkout_renders
      changed_when: false

    - name: Store both rendered manifests.
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "{{ checkout_run_dir }}/source/{{ item.item.name }}-render.yaml"
        mode: '0644'
      loop: "{{ checkout_renders.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Assert the render demonstrates the naming difference.
      ansible.builtin.assert:
        that:
          - "'name: servicename' in checkout_renders.results[0].stdout"
          - "'name: checkoutservice' in checkout_renders.results[1].stdout"
          - "'name: servicename' not in checkout_renders.results[1].stdout"

    - name: Read the actual frontend NodePort.
      ansible.builtin.command:
        argv: "{{ checkout_kubectl + ['get', 'service', 'frontend', '-o', 'jsonpath={.spec.ports[0].nodePort}'] }}"
      register: checkout_frontend_port
      changed_when: false

    - name: Set the experiment URL and context.
      ansible.builtin.set_fact:
        checkout_probe_url: "http://{{ hostvars[groups['k8s_nodes'][0]].ansible_host }}:{{ checkout_frontend_port.stdout }}"

    - name: Write the experiment context.
      ansible.builtin.copy:
        content: "{{ {'upstream_commit': checkout_upstream_commit.stdout, 'namespace': microservice_namespace, 'url': checkout_probe_url, 'started_utc': ansible_facts['date_time']['iso8601'], 'purpose': 'Controlled reproduction of the bug already documented in the assignment and fixed by baseline'} | to_nice_json }}\n"
        dest: "{{ checkout_run_dir }}/context.json"
        mode: '0644'

    - name: Capture the working baseline.
      ansible.builtin.include_tasks: tasks/checkout-evidence.yml
      vars:
        checkout_evidence_stage: baseline
        checkout_resource_name: checkoutservice

    - name: Prove checkout works before the experiment.
      ansible.builtin.command:
        argv: [python3, "{{ checkout_run_dir }}/checkout-smoke.py", "{{ checkout_probe_url }}", --expect, success, --evidence-dir, "{{ checkout_run_dir }}/baseline/http"]
      # This probe creates a demo order and changes its own cart session.
      changed_when: true

    - name: Reproduce the failure and always restore the original release values.
      block:
        - name: Deploy checkout using the upstream values without its appName override.
          kubernetes.core.helm:
            name: checkoutservice
            chart_ref: "{{ checkout_chart }}"
            release_namespace: "{{ microservice_namespace }}"
            values_files: ["{{ checkout_values_file }}"]
            values: "{{ microservice_common }}"
            reset_values: true
            kubeconfig: "{{ kubernetes_admin_conf }}"
            binary_path: "{{ helm_binary_path }}"
            state: present
            wait: true
            timeout: 3m0s

        - name: Confirm the expected Service name has disappeared.
          ansible.builtin.command:
            argv: "{{ checkout_kubectl + ['get', 'deployment,service', 'checkoutservice', '--ignore-not-found', '-o', 'name'] }}"
          register: checkout_missing_expected
          changed_when: false

        - name: Confirm the broken Service exists and its pod is available.
          ansible.builtin.command:
            argv: "{{ checkout_kubectl + ['get', 'deployment,service', 'servicename', '-o', 'name'] }}"
          register: checkout_present_wrong
          changed_when: false

        - name: Assert the live naming bug has actually been reproduced.
          ansible.builtin.assert:
            that:
              - checkout_missing_expected.stdout | trim == ''
              - "'deployment.apps/servicename' in checkout_present_wrong.stdout"
              - "'service/servicename' in checkout_present_wrong.stdout"

        - name: Preserve the broken runtime state even if the HTTP probe fails.
          ansible.builtin.include_tasks: tasks/checkout-evidence.yml
          vars:
            checkout_evidence_stage: broken-before-probe
            checkout_resource_name: servicename

        - name: Prove browsing and cart work while checkout fails for its backend.
          ansible.builtin.command:
            argv: [python3, "{{ checkout_run_dir }}/checkout-smoke.py", "{{ checkout_probe_url }}", --expect, failure, --evidence-dir, "{{ checkout_run_dir }}/broken/http"]
          register: checkout_failure_probe
          changed_when: true
          retries: 4
          delay: 10
          until: checkout_failure_probe.rc == 0

        - name: Announce the optional browser evidence window.
          ansible.builtin.debug:
            msg: "BROKEN_CHECKOUT_CAPTURE_READY: {{ checkout_probe_url }}; evidence {{ checkout_run_dir }}. Checkout will be restored after the observation window."

        - name: Allow a bounded window for a live browser screenshot.
          ansible.builtin.pause:
            seconds: "{{ checkout_diagnosis_observation_seconds | int }}"
          when: checkout_diagnosis_observation_seconds | int > 0

        - name: Collect the observed failure, DNS results and application logs.
          ansible.builtin.include_tasks: tasks/checkout-evidence.yml
          vars:
            checkout_evidence_stage: broken
            checkout_resource_name: servicename

      rescue:
        - name: Remember an experiment failure without skipping restoration.
          ansible.builtin.set_fact:
            checkout_experiment_failed: true
            checkout_experiment_error: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default('See playbook log') }}"

      always:
        - name: Restore checkout from its original release values through Ansible Helm.
          kubernetes.core.helm:
            name: checkoutservice
            chart_ref: "{{ checkout_chart }}"
            release_namespace: "{{ microservice_namespace }}"
            values: "{{ checkout_saved_values }}"
            reset_values: true
            kubeconfig: "{{ kubernetes_admin_conf }}"
            binary_path: "{{ helm_binary_path }}"
            state: present
            wait: true
            timeout: 3m0s

        - name: Preserve the restored runtime state before testing checkout recovery.
          ansible.builtin.include_tasks: tasks/checkout-evidence.yml
          vars:
            checkout_evidence_stage: restored-before-probe
            checkout_resource_name: checkoutservice

        - name: Prove checkout and cart clearing recover after restoration.
          ansible.builtin.command:
            argv: [python3, "{{ checkout_run_dir }}/checkout-smoke.py", "{{ checkout_probe_url }}", --expect, success, --evidence-dir, "{{ checkout_run_dir }}/restored/http"]
          register: checkout_recovery_probe
          changed_when: true
          # The v0.2.3 frontend keeps a gRPC connection with reconnect backoff.
          # Allow recovery after a prolonged outage without restarting frontend.
          retries: 30
          delay: 10
          until: checkout_recovery_probe.rc == 0

        - name: Capture the restored release and runtime state.
          ansible.builtin.include_tasks: tasks/checkout-evidence.yml
          vars:
            checkout_evidence_stage: restored
            checkout_resource_name: checkoutservice

    - name: Report an unsuccessful experiment after restoring checkout.
      ansible.builtin.assert:
        that: not checkout_experiment_failed
        fail_msg: "{{ checkout_experiment_error | default('Experiment failed; inspect the evidence and recap.') }}"
        success_msg: "Checkout bug reproduced and recovered. Evidence: {{ checkout_run_dir }}"

- name: Verify the complete baseline after the checkout experiment
  ansible.builtin.import_playbook: verify.yml
