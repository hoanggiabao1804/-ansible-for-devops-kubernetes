---
- name: Prepare Kubernetes hosts and build the cluster
  hosts: k8s
  become: true
  gather_facts: true
  tags:
    - kubernetes

  vars_files:
    - "{{ playbook_dir }}/../vars/cluster.yml"

  pre_tasks:
    # ------------------------------------------------------------------
    # Swap
    # ------------------------------------------------------------------

    - name: Disable swap immediately.
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_facts['swaptotal_mb'] | int > 0
      changed_when: true

    - name: Disable swap permanently in fstab.
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    # ------------------------------------------------------------------
    # Kernel modules
    # ------------------------------------------------------------------

    - name: Persist Kubernetes kernel modules.
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load overlay kernel module.
      ansible.builtin.command:
        cmd: modprobe overlay
      changed_when: false

    - name: Load br_netfilter kernel module.
      ansible.builtin.command:
        cmd: modprobe br_netfilter
      changed_when: false

    # ------------------------------------------------------------------
    # Kernel networking
    # ------------------------------------------------------------------

    - name: Configure Kubernetes networking sysctl values.
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
      notify: Apply Kubernetes sysctl

    # ------------------------------------------------------------------
    # Flannel manifest - only needed on the control plane.
    # ------------------------------------------------------------------

    - name: Download pinned Flannel manifest.
      ansible.builtin.get_url:
        url: "{{ flannel_manifest_url }}"
        dest: "{{ flannel_manifest_path }}"
        mode: "0644"
      when: kubernetes_role == "control_plane"

    - name: Force Flannel to use the Vagrant private interface.
      ansible.builtin.replace:
        path: "{{ flannel_manifest_path }}"
        # Replace the whole interface block, including duplicates from older runs.
        regexp: '^([ \t]*)- --kube-subnet-mgr[ \t]*(?:\r?\n\1- --iface=[^\r\n]*)*'
        replace: |-
          \1- --kube-subnet-mgr
          \1- --iface={{ kubernetes_private_interface }}
      when: kubernetes_role == "control_plane"

    - name: Verify patched Flannel interface.
      ansible.builtin.command:
        cmd: "grep -- --iface={{ kubernetes_private_interface }} {{ flannel_manifest_path }}"
      changed_when: false
      when: kubernetes_role == "control_plane"

  roles:
    - role: geerlingguy.containerd
      tags:
        - containerd
        - kubernetes

    - role: geerlingguy.kubernetes
      tags:
        - kubernetes

  handlers:
    - name: Apply Kubernetes sysctl
      ansible.builtin.command:
        cmd: sysctl --system


- name: Install Helm on the Kubernetes control plane
  hosts: k8s_master
  become: true
  gather_facts: true
  tags:
    - helm

  vars_files:
    - "{{ playbook_dir }}/../vars/cluster.yml"

  roles:
    - role: geerlingguy.helm
      tags:
        - helm


- name: Wait until Kubernetes is ready
  hosts: k8s_master
  become: true
  gather_facts: false
  tags:
    - kubernetes

  tasks:
    - name: Wait until every inventory node is registered and Ready.
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=Ready node {{ item }} --timeout=300s
      loop: "{{ groups['k8s'] }}"
      changed_when: false

    - name: Wait until all kube-system pods are Ready.
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s
      changed_when: false

    - name: Wait until the Flannel DaemonSet rollout is complete.
      ansible.builtin.command:
        cmd: kubectl rollout status daemonset/kube-flannel-ds -n kube-flannel --timeout=300s
      changed_when: false

    - name: Show Kubernetes nodes.
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      register: kubernetes_nodes
      changed_when: false

    - name: Print Kubernetes nodes.
      ansible.builtin.debug:
        var: kubernetes_nodes.stdout_lines

    - name: Show kube-system pods.
      ansible.builtin.command:
        cmd: kubectl get pods -n kube-system -o wide
      register: kube_system_pods
      changed_when: false

    - name: Print kube-system pods.
      ansible.builtin.debug:
        var: kube_system_pods.stdout_lines

    - name: Show Flannel pods.
      ansible.builtin.command:
        cmd: kubectl get pods -n kube-flannel -o wide
      register: flannel_pods
      changed_when: false

    - name: Print Flannel pods.
      ansible.builtin.debug:
        var: flannel_pods.stdout_lines
